<main>
    <h2>Mande seu pedido aqui</h2>
    <section>
        <div class="formulario pedido">
        <form>
        <label for="nome">nome completo:</label>
        <input type="text" name="nome completo"placeholder="digite seu nome completo"required><br>
        <label for="cpf"> seu CPF</label>
        <input type="text"name="cpf"placeholder="000.000.000-00"required><br>
        <label for="telefone">telefone</label>
        <input type="text" name="telefone" placeholder="telefone"required><br>
        <label for="cep">seu cep</label>
        <input type="text"name="cep" placeholder="digite seu cep"required><br>
        <label for="bairro">seu bairro</label>
        <input type="text" name="bairro" placeholder="seu barrio"required><br>
        <label for="rua">nome da rua</label>
        <input type="text" name="rua" placeholder="nome da rua" required><br>
        <label for="numero de residencia">numero de residencia</label>
         <input type="text" name="numero de residencia" placeholder="numero de residencia" required><br>
         <label>escolha o produto</label>
         <input list="produto" placeholder="Escolha o produto">

    <option value="X-Burger">
    <option value="X-Salada">
    <option value="X-Bacon">
    <option value="X-Tudo">
    <option value="X-Duplo">
    <option value="X-Picanha">
    <option value="X-Picanha Duplo">
    <option value="X-Monstro">
    <option value="Coxinha">
    <option value="Pastel">
    <option value="Bolinha de queijo">
    <option value="Bolinho de aipim">
    <option value="Enroladinho de salsicha">
    <option value="Quibe">
    <option value="Empadinha salgada">
    <option value="Empadinha doce">
    <option value="Pastel de forno">
    <option value="Hot Dog Simples">
    <option value="Hot Dog Completo">
    <option value="Hot Dog com Bacon">
    <option value="Hot Dog com Cheddar">
    <option value="Hot Dog Duplo">
    <option value="Mini-pizza">
    <option value="Misto-quente">
    <option value="Sanduíche natural">
    <option value="Sanduíche de frango">
    <option value="Tapioca de queijo">
    <option value="Tapioca de frango">
    <option value="Tapioca de presunto e queijo">
    <option value="Pão com queijo">
    <option value="Pão com ovo">
    <option value="Crepioca de queijo">
    <option value="Crepioca de frango">
         </datalist><br>
         <label for="escolha o acompanhamento">escolha o acompanhamento</label>

                <option value="Batata frita com cheddar">
                <option value="Batata frita com bacon">
                <option value="Calabresa acebolada">
                <option value="Frango a passarinho">
